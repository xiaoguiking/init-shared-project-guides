name: Release Skills

on:
  push:
    tags:
      - "skill/*/v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate target Skill and plugin
        run: |
          python3 - <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          errors = []
          tag = "${{ github.ref_name }}"
          tag_match = re.fullmatch(
              r"skill/([^/]+)/v((?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*))",
              tag,
          )
          if not tag_match:
              raise SystemExit(f"{tag}: expected skill/<skill-name>/v<version>.")

          skill_name, release_version = tag_match.groups()
          source_skill = Path("skills") / skill_name / "SKILL.md"
          plugin_root = Path("plugins") / skill_name
          manifest_path = plugin_root / ".codex-plugin/plugin.json"
          packaged_skill = plugin_root / "skills" / skill_name / "SKILL.md"

          if not source_skill.is_file():
              errors.append(f"missing {source_skill}.")
          else:
              text = source_skill.read_text(encoding="utf-8")
              match = re.match(r"^---\s*\n(.*?)\n---", text, re.DOTALL)
              if not match:
                  errors.append(f"{source_skill}: missing YAML frontmatter.")
              else:
                  frontmatter = match.group(1)
                  name = re.search(r"^name:\s*([^\s#]+)\s*$", frontmatter, re.MULTILINE)
                  description = re.search(r"^description:\s*(.+?)\s*$", frontmatter, re.MULTILINE)
                  version = re.search(
                      r"^\s+version:\s*[\"']?([^\"'\s]+)[\"']?\s*$",
                      frontmatter,
                      re.MULTILINE,
                  )
                  if not name or name.group(1) != skill_name:
                      errors.append(f"{source_skill}: name must match the release tag.")
                  if not description:
                      errors.append(f"{source_skill}: missing description.")
                  if not version or version.group(1) != release_version:
                      errors.append(f"{source_skill}: metadata.version must be {release_version}.")

          if manifest_path.is_file():
              manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
              if manifest.get("name") != skill_name:
                  errors.append(f"{manifest_path}: name must match the Skill.")
              if manifest.get("version") != release_version:
                  errors.append(f"{manifest_path}: version must be {release_version}.")
              if manifest.get("skills") != "./skills/":
                  errors.append(f"{manifest_path}: skills must point to ./skills/.")
              skill_files = sorted((plugin_root / "skills").glob("*/SKILL.md"))
              if len(skill_files) != 1 or skill_files[0].parent.name != skill_name:
                  errors.append(f"{manifest_path}: plugin must contain exactly its versioned Skill.")

          if source_skill.is_file() and packaged_skill.is_file() and source_skill.read_bytes() != packaged_skill.read_bytes():
              errors.append(f"{source_skill} and {packaged_skill} differ.")

          marketplace_path = Path(".agents/plugins/marketplace.json")
          if marketplace_path.exists():
              marketplace = json.loads(marketplace_path.read_text(encoding="utf-8"))
              for entry in marketplace.get("plugins", []):
                  source = entry.get("source", {})
                  path = source.get("path")
                  if source.get("source") != "local" or not isinstance(path, str):
                      errors.append(f"{marketplace_path}: each plugin needs a local source path.")
                  elif not (Path(path) / ".codex-plugin/plugin.json").is_file():
                      errors.append(f"{marketplace_path}: missing plugin manifest at {path}.")

          if errors:
              print("\n".join(errors), file=sys.stderr)
              raise SystemExit(1)
          print(f"Validated {skill_name} v{release_version}.")
          PY

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
